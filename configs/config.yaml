# Training configuration
training:
  batch_size: 32
  num_epochs: 100
  learning_rate: 0.001
  optimizer: 'adam'
  weight_decay: 0.0001
  
  # Learning rate scheduler
  scheduler:
    type: 'step'  # 'step', 'cosine', 'plateau'
    step_size: 30
    gamma: 0.1

# Model configuration
model:
  name: 'resnet50'  # 'resnet18', 'resnet50', 'vgg16', 'simple_cnn'
  num_classes: 10
  pretrained: true
  dropout: 0.5

# Data configuration
data:
  data_dir: './data'
  train_dir: './data/train'
  val_dir: './data/val'
  test_dir: './data/test'
  img_size: [224, 224]
  num_workers: 4
  
  # Data augmentation
  augmentation:
    horizontal_flip: true
    vertical_flip: false
    rotation: 15
    zoom_range: 0.2
    brightness_range: [0.8, 1.2]
    
  # Normalization (ImageNet stats)
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# Logging configuration
logging:
  log_dir: './logs'
  tensorboard: true
  wandb: false
  save_frequency: 5  # Save checkpoint every N epochs

# Checkpoint configuration
checkpoint:
  save_dir: './models/checkpoints'
  monitor: 'val_accuracy'
  mode: 'max'  # 'min' or 'max'
  save_best_only: true

# Hardware configuration
hardware:
  device: 'cuda'  # 'cuda' or 'cpu'
  gpu_id: 0
  mixed_precision: false

# Random seed for reproducibility
seed: 42
