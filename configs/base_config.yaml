# Base configuration for image classification

# Model settings
model:
  architecture: "resnet50"
  num_classes: 1000
  pretrained: true
  freeze_backbone: false

# Training settings
training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  optimizer: "adam"
  loss_function: "cross_entropy"
  early_stopping:
    patience: 10
    min_delta: 0.001

# Data settings
data:
  image_size: 224
  augmentation: true
  split_ratio:
    train: 0.7
    validation: 0.15
    test: 0.15

# Paths
paths:
  data_root: "./data"
  model_save: "./models/saved_models"
  logs: "./logs"
